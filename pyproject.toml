[project]
name = "shiplog"
version = "0.1.0"
description = "Gera posts do LinkedIn e artigos do Medium a partir de repositórios Git, usando o Claude Code CLI local."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.scripts]
shiplog = "shiplog.__main__:main"
shiplog-mcp = "shiplog.mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
